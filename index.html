<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lead Funnel Board</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--ink:#21231F;--ink-soft:#565A4E;--paper:#EDEFEA;--card:#FFF;--line:#D8DAD2;--line-strong:#B9BCAF;--bad:#A6432E;--s1:#EFE3CB;--s2:#E1CB9E;--s3:#CDAC6C;--s4:#B58C42;--s5:#93672A;--s6:#6C4519;--s1-ink:#4A3F1F;--s2-ink:#40350F;--s3-ink:#332705;--s4-ink:#2B1F04;--s5-ink:#F3E7D2;--s6-ink:#F3E7D2}*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh}.wrap{max-width:1400px;margin:auto;padding:32px 28px 60px}header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(28px,4vw,40px);margin:0 0 6px;line-height:1.05}.sub{color:var(--ink-soft);font-size:15px;max-width:60ch;margin:0}.add-btn{background:var(--ink);color:var(--paper);border:0;font:500 15px 'IBM Plex Sans';padding:12px 20px;border-radius:3px;cursor:pointer}.add-btn:hover{background:#3A3D33}.add-btn:disabled{opacity:.5;cursor:wait}.board{display:grid;grid-auto-flow:column;grid-auto-columns:270px;gap:14px;overflow-x:auto;padding-bottom:12px}.col{display:flex;flex-direction:column;min-height:200px}.col-head{border-radius:4px 4px 0 0;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.stage-line{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.col-num{font:600 13px Fraunces,serif;opacity:.7}.col-title{font:600 17px Fraunces,serif;line-height:1.15}.col-count{font-size:12px;font-weight:500;background:#ffffff73;border-radius:10px;padding:2px 8px}.col-body{background:#E4E5DE;border:1px solid var(--line);border-top:0;border-radius:0 0 4px 4px;flex:1;min-height:120px;padding:10px;display:flex;flex-direction:column;gap:8px}.col-body.drag-over{background:#D9DBCE}.empty-hint{color:var(--ink-soft);font-size:12.5px;text-align:center;padding:18px 6px;border:1px dashed var(--line-strong);border-radius:4px}.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:11px 12px 9px;cursor:grab}.card:active{cursor:grabbing}.card.dragging{opacity:.4}.card-name{font-weight:600;font-size:14.5px;margin:0 0 3px;line-height:1.25}.card-meta{color:var(--ink-soft);font-size:12px;line-height:1.5;word-break:break-word}.card-notes{font-size:12.5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);line-height:1.4}.card-date{font-size:11px;color:var(--line-strong);margin-top:6px}.card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.move-btns{display:flex;gap:4px}.icon-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:12px;line-height:1;padding:4px 7px;border-radius:3px;cursor:pointer;font-family:inherit}.icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}.icon-btn:disabled{opacity:.3;cursor:not-allowed}.del-btn{background:none;border:0;color:var(--bad);font-size:12px;cursor:pointer;font-family:inherit;padding:4px 6px}.del-btn:hover{text-decoration:underline}.overlay{position:fixed;inset:0;background:#21231f73;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px;z-index:50}.overlay.open{display:flex}.modal{background:var(--card);border-radius:6px;width:100%;max-width:420px;padding:26px;box-shadow:0 12px 40px #21231f40}.modal h2{font:600 22px Fraunces,serif;margin:0 0 4px}.modal-sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px}.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:3px;padding:9px 10px;font:14px 'IBM Plex Sans';color:var(--ink);background:#FBFBF9}.field textarea{resize:vertical;min-height:56px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.btn-secondary{background:none;border:1px solid var(--line-strong);padding:9px 16px;border-radius:3px;cursor:pointer;font:14px 'IBM Plex Sans'}.btn-primary{background:var(--ink);color:var(--paper);border:0;padding:9px 16px;border-radius:3px;cursor:pointer;font:500 14px 'IBM Plex Sans'}.error-text{color:var(--bad);font-size:12px;margin-top:4px}.bottom{margin-top:22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}.status-text{font-size:12px;color:var(--ink-soft)}.reset-btn{background:none;border:0;color:var(--bad);font-size:12.5px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><div class="wrap"><header class="top"><div><h1>Lead Funnel Board</h1><p class="sub">Every lead starts with the 5-Day Reset Challenge form and moves right as they commit deeper — through the Workshop, UHP, RTM, Master, and Master Legacy.</p></div><button class="add-btn" id="openAdd" type="button">Add lead</button></header><div class="board" id="board"></div><footer class="bottom"><span class="status-text" id="statusText">Loading saved leads…</span><button class="reset-btn" id="resetBtn" type="button">Clear all leads</button></footer></div><div class="overlay" id="overlay"><div class="modal"><h2>Add a lead</h2><p class="modal-sub">New leads are placed at the start of the funnel.</p><form id="leadForm"><div class="field"><label for="fName">Name</label><input id="fName" type="text" autocomplete="off"><div class="error-text" id="nameError" style="display:none">Enter a name to continue.</div></div><div class="field"><label for="fContact">Email or phone</label><input id="fContact" type="text" autocomplete="off" placeholder="e.g. priya@email.com or +91 98xxxxxxx"></div><div class="field"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="Payment status, source, follow-up notes…"></textarea></div><div class="modal-actions"><button type="button" class="btn-secondary" id="cancelAdd">Cancel</button><button type="submit" class="btn-primary">Add lead</button></div></form></div></div><script>
const STAGES=[{name:'5-Day Reset Challenge Form'},{name:'2-Day Workshop'},{name:'2-Month UHP'},{name:'3-Month RTM'},{name:'3-Month Master'},{name:'4-Month Master Legacy'}];const API='/.netlify/functions/leads',LOCAL_KEY='crm-leads-v2';let leads=[],draggedId=null;const $=id=>document.getElementById(id),board=$('board'),statusText=$('statusText'),overlay=$('overlay'),leadForm=$('leadForm'),nameInput=$('fName'),nameError=$('nameError'),openAdd=$('openAdd');function uid(){return'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function formatDate(iso){const d=new Date(iso);return Number.isNaN(d.getTime())?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function setStatus(t){statusText.textContent=t}function readLocal(){try{const x=JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function writeLocal(){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(leads));return true}catch{return false}}
async function loadLeads(){openAdd.disabled=true;setStatus('Loading saved leads…');const local=readLocal();try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error('load failed');const data=await r.json();const remote=Array.isArray(data.leads)?data.leads:[];if(remote.length||!local.length){leads=remote;writeLocal()}else{leads=local;await saveLeads()}setStatus(`${leads.length} ${leads.length===1?'lead':'leads'} on the board — saved.`)}catch(e){leads=local;setStatus(`${leads.length} ${leads.length===1?'lead':'leads'} loaded from this browser.`);console.error(e)}finally{openAdd.disabled=false;render()}}
async function saveLeads(){writeLocal();setStatus('Saving…');try{const r=await fetch(API,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({leads})});if(!r.ok)throw Error('save failed');writeLocal();setStatus(`${leads.length} ${leads.length===1?'lead':'leads'} on the board — saved.`)}catch(e){setStatus(`${leads.length} ${leads.length===1?'lead':'leads'} saved on this browser. Cloud sync unavailable.`);console.error(e)}}
function render(){board.innerHTML='';STAGES.forEach((stage,idx)=>{const col=document.createElement('div');col.className='col';const head=document.createElement('div');head.className='col-head';head.style.background=`var(--s${idx+1})`;head.style.color=`var(--s${idx+1}-ink)`;const stageLeads=leads.filter(l=>l.stage===idx);head.innerHTML=`<div class="stage-line"><span class="col-num">Stage ${idx+1}</span><span class="col-count">${stageLeads.length}</span></div><span class="col-title">${stage.name}</span>`;col.appendChild(head);const body=document.createElement('div');body.className='col-body';body.dataset.stage=idx;body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('drag-over')});body.addEventListener('dragleave',()=>body.classList.remove('drag-over'));body.addEventListener('drop',e=>{e.preventDefault();body.classList.remove('drag-over');if(draggedId)moveLead(draggedId,idx)});if(!stageLeads.length){const h=document.createElement('div');h.className='empty-hint';h.textContent=idx===0?'New leads land here.':'No leads at this stage yet.';body.appendChild(h)}stageLeads.forEach(l=>body.appendChild(renderCard(l,idx)));col.appendChild(body);board.appendChild(col)})}
function renderCard(lead,idx){const card=document.createElement('div');card.className='card';card.draggable=true;card.addEventListener('dragstart',()=>{draggedId=lead.id;card.classList.add('dragging')});card.addEventListener('dragend',()=>{card.classList.remove('dragging');draggedId=null});const n=document.createElement('p');n.className='card-name';n.textContent=lead.name;card.appendChild(n);if(lead.contact){const m=document.createElement('p');m.className='card-meta';m.textContent=lead.contact;card.appendChild(m)}if(lead.notes){const x=document.createElement('p');x.className='card-notes';x.textContent=lead.notes;card.appendChild(x)}const d=document.createElement('p');d.className='card-date';d.textContent='Added '+formatDate(lead.dateAdded);card.appendChild(d);const actions=document.createElement('div');actions.className='card-actions';const moves=document.createElement('div');moves.className='move-btns';const back=document.createElement('button');back.className='icon-btn';back.type='button';back.textContent='←';back.title='Move to previous stage';back.disabled=idx===0;back.onclick=()=>moveLead(lead.id,idx-1);const fwd=document.createElement('button');fwd.className='icon-btn';fwd.type='button';fwd.textContent='→';fwd.title='Move to next stage';fwd.disabled=idx===STAGES.length-1;fwd.onclick=()=>moveLead(lead.id,idx+1);moves.append(back,fwd);const del=document.createElement('button');del.className='del-btn';del.type='button';del.textContent='Remove';del.onclick=()=>deleteLead(lead.id);actions.append(moves,del);card.appendChild(actions);return card}
async function moveLead(id,newStage){if(newStage<0||newStage>=STAGES.length)return;const l=leads.find(x=>x.id===id);if(!l||l.stage===newStage)return;l.stage=newStage;render();await saveLeads()}async function deleteLead(id){leads=leads.filter(l=>l.id!==id);render();await saveLeads()}async function addLead(name,contact,notes){leads.push({id:uid(),name:name.trim(),contact:contact.trim(),notes:notes.trim(),stage:0,dateAdded:new Date().toISOString()});writeLocal();render();await saveLeads()}function closeModal(){overlay.classList.remove('open')}$('openAdd').onclick=()=>{overlay.classList.add('open');nameError.style.display='none';leadForm.reset();nameInput.focus()};$('cancelAdd').onclick=closeModal;overlay.onclick=e=>{if(e.target===overlay)closeModal()};document.onkeydown=e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeModal()};leadForm.onsubmit=async e=>{e.preventDefault();const name=nameInput.value.trim();if(!name){nameError.style.display='block';nameInput.focus();return}await addLead(name,$('fContact').value,$('fNotes').value);closeModal()};$('resetBtn').onclick=async()=>{if(!leads.length)return;if(confirm('Remove all leads from the board? This cannot be undone.')){leads=[];writeLocal();render();await saveLeads()}};loadLeads();
</script></body></html>
