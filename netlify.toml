[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "session-gate"
  path = "/index.html"

[[edge_functions]]
  function = "session-gate"
  path = "/pipeline"

[[edge_functions]]
  function = "session-gate"
  path = "/dashboard"

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 302

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
